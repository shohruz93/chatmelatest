<div class="login-page">
    <header class="header">
        <div class="logo" routerLink="/">Chatme</div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="icon-wrapper">
                    <span class="chat-icon">💬</span>
                </div>
                <h1 class="title">{{ 'AUTH.WELCOME' | translate }}</h1>
                <p class="subtitle">{{ 'AUTH.SUBTITLE' | translate }}</p>
            </div>

            <div class="card-body">
                <button (click)="login()" class="btn-google" [disabled]="isLoading()">
                    @if (!isLoading()) {
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" />
                        <path fill="#EA4335"
                            d="M12 4.81c1.6 0 3.02.55 4.13 1.62l3.09-3.09C17.45 1.53 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    }
                    @if (isLoading()) {
                    <div class="loader"></div>
                    }
                    <span>{{ (isLoading() ? 'AUTH.SIGNING_IN' : 'AUTH.CONTINUE_GOOGLE') | translate }}</span>
                </button>

                <button (click)="toggleEmailForm()" class="btn-email-toggle btn-facebook" [disabled]="isLoading()">
                    <span>{{ 'AUTH.CONTINUE_EMAIL' | translate }}</span>
                </button>

                @if (emailFormOpen()) {
                <div class="email-form">
                    <input type="email" class="input-email" placeholder="{{ 'AUTH.EMAIL_PLACEHOLDER' | translate }}"
                        [value]="email()" (input)="email.set($any($event.target).value)" />
                    <div class="email-actions">
                        <button (click)="sendCode()" class="btn-send-code btn-facebook"
                            [disabled]="isLoading() || !email() || codeSent()">{{ (codeSent() ? 'AUTH.EMAIL_CODE_SENT' :
                            'AUTH.SEND_CODE') | translate }}</button>
                    </div>

                    @if (codeSent()) {
                    <input type="text" class="input-code" placeholder="{{ 'AUTH.CODE_PLACEHOLDER' | translate }}"
                        [value]="code()" (input)="code.set($any($event.target).value)" />
                    <div class="email-actions">
                        <button (click)="verifyCode()" class="btn-verify btn-google"
                            [disabled]="isLoading() || !code()">{{ 'AUTH.VERIFY_CODE' | translate }}</button>
                    </div>
                    }
                </div>
                }

                @if (error()) {
                <div class="error-message">
                    {{ error() }}
                </div>
                }

                <div class="card-footer">
                    <p class="terms">
                        {{ 'AUTH.TERMS_AGREE' | translate }}
                        <a href="#" class="link">{{ 'AUTH.TERMS' | translate }}</a> {{ 'AUTH.AND' | translate }}
                        <a href="#" class="link">{{ 'AUTH.PRIVACY' | translate }}</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="background-decoration">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
            </div>
    </main>
</div>
