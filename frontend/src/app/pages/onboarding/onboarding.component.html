<div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-12 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
    <div class="card max-w-2xl w-full space-y-8 animate-fade-in-up">
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white">Complete your profile</h2>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                Tell us about yourself to find better matches.
            </p>
        </div>

        <div class="space-y-6">
            <div>
                <label for="bio" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Bio</label>
                <div class="mt-1">
                    <textarea id="bio" name="bio" rows="3" [(ngModel)]="bio" class="input-field"
                        placeholder="I love hiking and coding..."></textarea>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Interests</label>
                <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
                    <button *ngFor="let interest of interests" (click)="toggleInterest(interest)"
                        [class.ring-2]="interest.selected" [class.ring-indigo-500]="interest.selected"
                        [class.bg-indigo-50]="interest.selected" [class.dark:bg-indigo-900]="interest.selected"
                        class="relative rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-6 py-5 shadow-sm flex items-center space-x-3 hover:border-gray-400 focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-indigo-500 transition-all">
                        <div class="flex-1 min-w-0">
                            <span class="absolute inset-0" aria-hidden="true"></span>
                            <p class="text-sm font-medium text-gray-900 dark:text-white text-center">{{ interest.name }}
                            </p>
                        </div>
                    </button>
                </div>
            </div>

            <div>
                <button (click)="saveProfile()"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Start Chatting
                </button>
            </div>
        </div>
    </div>
</div>
