<div class="container mx-auto p-4" *ngIf="isAdmin">
  <h1 class="text-2xl font-bold mb-4">Admin Panel</h1>

  <div *ngIf="usersResponse$ | async as usersResponse">
    <div class="mb-4">
      <input type="text" placeholder="Search users..." class="p-2 border rounded w-full">
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full bg-white">
        <thead class="bg-gray-800 text-white">
          <tr>
            <th class="w-1/6 py-2 px-4 text-left">ID</th>
            <th class="w-1/4 py-2 px-4 text-left">Name</th>
            <th class="w-1/4 py-2 px-4 text-left">Email</th>
            <th class="w-1/6 py-2 px-4 text-left">Admin</th>
            <th class="w-1/6 py-2 px-4 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of usersResponse.users" class="border-b">
            <td class="py-2 px-4">{{ user.id }}</td>
            <td class="py-2 px-4">{{ user.name }}</td>
            <td class="py-2 px-4">{{ user.email }}</td>
            <td class="py-2 px-4">{{ user.is_admin ? 'Yes' : 'No' }}</td>
            <td class="py-2 px-4">
              <button (click)="banUser(user.id)" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                Ban
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 flex justify-between items-center">
      <p>Page {{ usersResponse.page }} of {{ usersResponse.pages }}</p>
      <div class="flex">
        <button [disabled]="usersResponse.page <= 1" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l">
          Prev
        </button>
        <button [disabled]="usersResponse.page >= usersResponse.pages" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-r">
          Next
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!(usersResponse$ | async)">
    <p>Loading users...</p>
  </div>
</div>
<div *ngIf="!isAdmin">
    <p>You are not authorized to view this page.</p>
</div>
