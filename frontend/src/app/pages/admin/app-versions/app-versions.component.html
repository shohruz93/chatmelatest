<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">App Versions & Updates</h1>

    <!-- Upload Form -->
    <div class="mt-8 mb-8 p-6 bg-white dark:bg-gray-800 rounded-lg shadow-md border dark:border-gray-700">
        <h2 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">Upload App Update</h2>
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Platform</label>
                    <select [(ngModel)]="platform"
                        class="p-2 border rounded w-full bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                        <option value="android">Android</option>
                        <option value="ios">iOS</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Version (e.g.
                        1.0.0)</label>
                    <input type="text" [(ngModel)]="version"
                        class="p-2 border rounded w-full bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Version Code
                        (integer)</label>
                    <input type="number" [(ngModel)]="versionCode"
                        class="p-2 border rounded w-full bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">Release Notes</label>
                <textarea [(ngModel)]="releaseNotes"
                    class="p-2 border rounded w-full bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500"
                    rows="3"></textarea>
            </div>
            <div>
                <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-300">App File (APK/IPA)</label>
                <input type="file" (change)="onFileSelected($event)"
                    class="p-2 border rounded w-full bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 text-sm">
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">OR</p>
                <input type="text" [(ngModel)]="fileUrl" placeholder="Direct URL (if external)"
                    class="p-2 border rounded w-full bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-blue-500 focus:border-blue-500 mt-1">
            </div>

            <div *ngIf="uploadProgress > 0" class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700 mt-4">
                <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" [style.width.%]="uploadProgress"></div>
                <p class="text-xs text-gray-500 mt-1">Uploading: {{uploadProgress}}%</p>
            </div>

            <button (click)="uploadApp()" [disabled]="uploadProgress > 0"
                class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition-colors shadow disabled:opacity-50 mt-4">
                {{ uploadProgress > 0 ? 'Uploading...' : 'Upload Update' }}
            </button>
            <p *ngIf="uploadMessage" class="mt-2 text-sm font-semibold"
                [ngClass]="uploadMessage.startsWith('Upload successful') ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'">
                {{ uploadMessage
                }}
            </p>
        </div>
    </div>

    <!-- History Table -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <h2 class="text-xl font-bold p-4 bg-gray-50 border-b">Version History</h2>
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Platform
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Version
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let v of versions$ | async">
                    <td class="px-6 py-4 whitespace-nowrap uppercase font-bold text-sm"
                        [class.text-green-600]="v.platform==='android'" [class.text-blue-600]="v.platform==='ios'">
                        {{ v.platform }}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ v.version }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ v.version_code }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ v.created_at | date:'medium' }}
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500 truncate max-w-xs" [title]="v.release_notes">{{
                        v.release_notes }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
