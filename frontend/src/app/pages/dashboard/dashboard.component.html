<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="ui.sidebarOpen()">
        <div class="sidebar-header">
            <div class="logo" routerLink="chat">Chatme</div>
            <button class="sidebar-close" (click)="ui.toggleSidebar()">✕</button>
        </div>

        <div class="sidebar-content">
            <!-- Profile Link -->
            <div class="user-profile" routerLink="profile" routerLinkActive="active" title="Go to Profile">
                <div class="profile-avatar">
                    @if (userAvatar) {
                    <img [src]="userAvatar" [alt]="userDisplayName">
                    } @else {
                    <span class="avatar-text">{{ userDisplayName.charAt(0) || 'U' }}</span>
                    }
                    <span class="online-status-dot"></span>
                </div>
                <div class="profile-info">
                    <div class="profile-name">{{ userDisplayName }}</div>
                    <div class="profile-status">Online</div>
                </div>
            </div>

            <!-- Messages Link -->
            <a routerLink="conversations" routerLinkActive="active" class="btn-messages">
                <span class="btn-icon">💬</span>
                <span>Messages</span>
                @if (unreadCount > 0) {
                <span class="badge">{{ unreadCount }}</span>
                }
            </a>

            <!-- Explore Link -->
            <a routerLink="explore" routerLinkActive="active" class="btn-messages">
                <span class="btn-icon">🔍</span>
                <span>Explore</span>
            </a>

            <!-- Admin Link -->
            @if (currentUser?.is_admin) {
            <a routerLink="/admin" routerLinkActive="active" class="btn-messages admin-link">
                <span class="btn-icon">🛡️</span>
                <span>Admin Panel</span>
            </a>
            }

            <!-- Theme Toggle -->
            <button class="btn-theme-sidebar" (click)="toggleTheme()">
                <span class="btn-icon">{{ isDarkMode() ? '☀️' : '🌙' }}</span>
                <span>{{ isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <button class="sidebar-toggle" (click)="ui.toggleSidebar()">☰</button>
            <div class="logo-mobile">Chatme</div>
        </header>

        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
