<div class="missions-container">
    <h3 class="missions-title">{{ 'MISSIONS.TITLE' | translate }}</h3>

    <!-- Earn Coins (Rewarded Ad Section) -->
    <div class="earn-coins-section glass-panel"
        style="margin: 0 0 1.5rem 0; padding: 1rem; text-align: center; border-radius: 12px; background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.05)); border: 1px solid rgba(255, 215, 0, 0.3);">
        <h4 style="margin-top: 0; margin-bottom: 0.5rem; color: #d4af37; font-size: 1.1rem;">{{ 'COINS.EARN_FREE_COINS'
            | translate }}</h4>
        <p style="font-size: 0.85rem; color: #a0aec0; margin-bottom: 0.8rem;">Claim your free coins every 5 minutes!</p>
        <button class="btn-primary" (click)="watchAd()" [disabled]="adLoading || showAdBanner()"
            style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; max-width: 250px; margin: 0 auto; background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #000; font-weight: bold; border-radius: 8px; padding: 0.6rem;">
            <span class="material-icons" style="font-size: 1.2rem;">{{ adLoading ? 'timer' : 'card_giftcard' }}</span>
            @if (showAdBanner()) {
                {{ adCountdown() }}s remaining...
            } @else {
                {{ adLoading ? 'Next reward in ' + cooldownRemaining() : 'Claim Coins (+1 🪙)' }}
            }
        </button>

        @if (showAdBanner()) {
        <div class="ad-banner-container mt-4 flex justify-center items-center w-full min-h-[400px]">
            <iframe src="https://turbulentrefreshments.com/xvsg557b7p?key=928dbe8b524af5ce05cf5c9ecd083c13" 
                    width="100%" height="400" frameborder="0" style="border-radius: 8px;"></iframe>
        </div>
        }
    </div>
</div>
