<div class="wallet-container">
    <div class="currency-card coins" (click)="onCoinsClick()">
        <div class="icon-wrapper spin-animation">🪙</div>
        <div class="amount">
            <span class="value">{{ gameService.userCoins() }}</span>
            <span class="label">{{ 'COINS.TITLE' | translate }}</span>
        </div>
        <div class="add-coins-btn" title="Earn more coins">
            <div class="plus-ring"></div>
            <div class="plus-ring ring-2"></div>
            <span class="plus-icon">+</span>
        </div>
    </div>

    <div class="currency-card xp">
        <div class="xp-info">
            <span class="level-badge">{{ 'GAMIFICATION.LEVEL_SHORT' | translate }} {{ level }}</span>
            <span class="xp-text">{{ currentXpInLevel }} / {{ maxLevelXp }} XP</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="progressPercent"></div>
        </div>
    </div>

</div>
