<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- FILTERS FOR GLOW AND DEPTH -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- GRADIENTS -->
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020408" /> <!-- Almost Black -->
      <stop offset="100%" stop-color="#050A14" /> <!-- Deep Navy -->
    </linearGradient>

    <!-- Cyberpunk Lighting Gradients -->
    <linearGradient id="rim-light-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="rim-light-purple" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bc13fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bc13fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Phone Screen Glow -->
    <radialGradient id="phone-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Skin Tones (Lit by screen) -->
    <radialGradient id="skin-dark" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8d5524"/>
      <stop offset="100%" stop-color="#3c220a"/>
    </radialGradient>
    <radialGradient id="skin-med" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#e0ac69"/>
      <stop offset="100%" stop-color="#8d5524"/>
    </radialGradient>
    <radialGradient id="skin-light" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffdbac"/>
      <stop offset="100%" stop-color="#dba269"/>
    </radialGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- GROUP COMPOSITION -->
  <g transform="translate(400, 350)">
    
    <!-- LEFT FRIEND (Leaning in) -->
    <g transform="translate(-160, 20) rotate(-10)">
      <!-- Body -->
      <path d="M-70,60 Q-80,150 0,180 Q80,150 70,60 Z" fill="#1a1f2e"/>
      <!-- Rim Light Left -->
      <path d="M-70,60 Q-80,150 -40,170" fill="none" stroke="url(#rim-light-blue)" stroke-width="4"/>
      <!-- Head -->
      <ellipse cx="0" cy="0" rx="55" ry="65" fill="url(#skin-dark)" filter="url(#soft-shadow)"/>
      <!-- Hair -->
      <path d="M-55,-10 Q-60,-70 0,-75 Q60,-70 55,-10 Q60,20 55,10 Q0,-20 -55,10 Z" fill="#111"/>
      <!-- Face (Laughing) -->
      <path d="M-15,20 Q0,40 15,20 Z" fill="#3a1a00"/> <!-- Mouth -->
      <path d="M-15,20 Q0,25 15,20" fill="#fff"/> <!-- Teeth -->
    </g>

    <!-- RIGHT FRIEND (Leaning in) -->
    <g transform="translate(160, 20) rotate(10)">
      <!-- Body -->
      <path d="M-70,60 Q-80,150 0,180 Q80,150 70,60 Z" fill="#1f1a2e"/>
      <!-- Rim Light Right -->
      <path d="M70,60 Q80,150 40,170" fill="none" stroke="url(#rim-light-purple)" stroke-width="4"/>
      <!-- Head -->
      <ellipse cx="0" cy="0" rx="55" ry="65" fill="url(#skin-light)" filter="url(#soft-shadow)"/>
      <!-- Hair (Curly) -->
      <circle cx="-50" cy="-20" r="15" fill="#d4af37"/>
      <circle cx="-30" cy="-50" r="20" fill="#d4af37"/>
      <circle cx="0" cy="-60" r="20" fill="#c5a028"/>
      <circle cx="30" cy="-50" r="20" fill="#d4af37"/>
      <circle cx="50" cy="-20" r="15" fill="#c5a028"/>
      <!-- Face (Laughing) -->
      <path d="M-15,20 Q0,40 15,20 Z" fill="#8a4a4a"/>
      <path d="M-15,20 Q0,25 15,20" fill="#fff"/>
    </g>

    <!-- CENTER FRIEND (Holding Phone) -->
    <g transform="translate(0, 40)">
      <!-- Body -->
      <path d="M-80,80 Q-90,200 0,220 Q90,200 80,80 Z" fill="#252525"/>
      <!-- Shoulders Rim Light -->
      <path d="M-80,80 Q-85,120 -60,150" fill="none" stroke="url(#rim-light-blue)" stroke-width="3"/>
      <path d="M80,80 Q85,120 60,150" fill="none" stroke="url(#rim-light-purple)" stroke-width="3"/>
      
      <!-- Head -->
      <ellipse cx="0" cy="0" rx="60" ry="70" fill="url(#skin-med)" filter="url(#soft-shadow)"/>
      <!-- Hair -->
      <path d="M-60,0 Q-70,-80 0,-90 Q70,-80 60,0 L60,80 Q0,90 -60,80 Z" fill="#222"/>
      <!-- Face (Laughing) -->
      <path d="M-20,25 Q0,50 20,25 Z" fill="#5e2f2f"/>
      <path d="M-20,25 Q0,30 20,25" fill="#fff"/>
      
      <!-- Hands holding phone -->
      <circle cx="-50" cy="140" r="20" fill="url(#skin-med)"/>
      <circle cx="50" cy="140" r="20" fill="url(#skin-med)"/>
      
      <!-- PHONE -->
      <g transform="translate(0, 130)">
        <rect x="-45" y="-70" width="90" height="160" rx="10" fill="#111" stroke="#333" stroke-width="2"/>
        <!-- Screen -->
        <rect x="-40" y="-65" width="80" height="150" rx="5" fill="#fff"/>
        <rect x="-40" y="-65" width="80" height="150" rx="5" fill="url(#phone-glow)" opacity="0.8"/>
        <!-- Screen Light Reflection on faces (Invisible shape casting glow upwards) -->
      </g>
    </g>
  </g>

  <!-- FLOATING BUBBLES -->
  <!-- Bubble 1: Translation -->
  <g transform="translate(280, 200)" filter="url(#neon-glow)">
    <path d="M0,0 L20,-20 L100,-20 Q110,-20 110,-30 L110,-80 Q110,-90 100,-90 L-40,-90 Q-50,-90 -50,-80 L-50,-30 Q-50,-20 -40,-20 L0,0 Z" fill="#1a1f35" stroke="#00f3ff" stroke-width="2"/>
    <!-- Icon A -> 文 -->
    <text x="30" y="-45" font-family="sans-serif" font-size="24" fill="#00f3ff" text-anchor="middle" font-weight="bold">A ⇄ 文</text>
  </g>

  <!-- Bubble 2: Heart -->
  <g transform="translate(520, 180)" filter="url(#neon-glow)">
    <path d="M0,0 L-20,-20 L-80,-20 Q-90,-20 -90,-30 L-90,-80 Q-90,-90 -80,-90 L40,-90 Q50,-90 50,-80 L50,-30 Q50,-20 40,-20 L0,0 Z" fill="#1f1a2e" stroke="#bc13fe" stroke-width="2"/>
    <!-- Heart Icon -->
    <path d="M-20,-55 C-20,-70 -5,-70 -5,-55 C-5,-70 10,-70 10,-55 C10,-40 -5,-30 -5,-30 C-5,-30 -20,-40 -20,-55" fill="#bc13fe" transform="translate(-15, 0)"/>
  </g>

  <!-- ATMOSPHERE / LIGHTING OVERLAY -->
  <!-- Blue Rim Light (Left) -->
  <rect x="0" y="0" width="800" height="600" fill="url(#rim-light-blue)" style="mix-blend-mode: overlay; opacity: 0.3"/>
  <!-- Purple Rim Light (Right) -->
  <rect x="0" y="0" width="800" height="600" fill="url(#rim-light-purple)" style="mix-blend-mode: overlay; opacity: 0.3"/>

</svg>